# protected.conf — Configuración de mmap-guard
#
# Formato (una directiva por línea, '#' inicia comentario):
#   protect <ruta>     Archivo protegido: se bloquea MAP_SHARED+PROT_WRITE y mprotect(+W/+X).
#   noexec  <ruta>     Archivo protegido contra PROT_EXEC (anti-inyección de código).
#   allow_uid <uid>    UID en lista blanca: sus operaciones se auditan pero no se bloquean.
#
# El loader resuelve cada ruta a (dispositivo, inode) con stat(); el kernel nunca compara rutas.

protect /tmp/mmap-guard-demo/secreto.txt
noexec  /tmp/mmap-guard-demo/payload.bin
# allow_uid 0
